<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>claude-mind — grafo ao vivo</title>
<style>
  :root { --bg:#0e0e11; --surface:#17171b; --border:#2a2a31; --text:#e7e7ea; --muted:#8b8b95; --accent:#C9A96A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  header { display:flex; align-items:center; gap:16px; padding:12px 18px; border-bottom:1px solid var(--border); }
  header h1 { font-size:15px; margin:0; font-weight:700; letter-spacing:.02em; }
  header h1 span { color:var(--accent); }
  .stats { display:flex; gap:14px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .stats b { color:var(--text); }
  .live { margin-left:auto; font-size:11px; color:#6ac98a; display:flex; align-items:center; gap:6px; }
  .live::before { content:""; width:7px; height:7px; border-radius:50%; background:#6ac98a; box-shadow:0 0 8px #6ac98a; }
  .wrap { display:flex; height:calc(100vh - 50px); }
  svg { flex:1; cursor:grab; }
  svg:active { cursor:grabbing; }
  .edge { stroke:var(--border); }
  .edge.mem { stroke-dasharray:3 3; opacity:.55; }
  .node { cursor:pointer; }
  .node text { font-size:11px; fill:var(--muted); pointer-events:none; }
  .node.sel circle, .node.sel rect { stroke:var(--accent); stroke-width:2.5; }
  aside { width:300px; border-left:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:16px; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 8px; }
  .card { border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--bg); }
  .card .t { font-weight:700; }
  .card .tag { font-size:10px; text-transform:uppercase; padding:1px 7px; border-radius:99px; margin-left:6px; }
  .card p { color:var(--muted); font-size:12.5px; margin:6px 0 0; }
  .chip { display:inline-block; font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:99px; padding:1px 8px; margin:3px 3px 0 0; }
  .legend { display:flex; gap:12px; padding:8px 18px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .act { font-size:12px; padding:7px 0; border-bottom:1px solid var(--border); }
  .act .who { color:var(--accent); font-weight:600; }
  .act .when { color:var(--muted); font-size:10.5px; }
  .empty { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>claude&#8209;<span>mind</span></h1>
  <div class="stats" id="stats"></div>
  <div class="live">ao vivo</div>
</header>
<div class="wrap">
  <svg id="svg"><g id="scene"></g></svg>
  <aside>
    <div id="detail"><h2>Detalhe</h2><p class="empty">Clique num nó pra ver os detalhes.</p></div>
    <h2 style="margin-top:18px">Atividade recente</h2>
    <div id="activity"><p class="empty">Sem atividade. Rode <code>node scripts/log.mjs &lt;agente&gt; &lt;tipo&gt; "..."</code></p></div>
  </aside>
</div>
<div class="legend">
  <span><i style="background:#C9A96A"></i>meta</span>
  <span><i style="background:#6AA9C9"></i>domínio</span>
  <span><i style="background:#C96A8A"></i>sub-agente</span>
  <span><i style="background:#6a6a72"></i>memória</span>
  <span style="margin-left:auto">arraste pra mover · scroll pra zoom</span>
</div>
<script>
const svg = document.getElementById('svg'), scene = document.getElementById('scene');
let view = { x: 0, y: 0, k: 1 }, sel = null;

function el(tag, attrs, kids) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (kids || []).forEach((c) => e.appendChild(c)); return e; }

async function render() {
  const g = await (await fetch('/api/graph')).json();
  const s = g.stats;
  document.getElementById('stats').innerHTML =
    `<span><b>${s.agents}</b> agentes</span><span><b>${s.meta}</b> meta · <b>${s.domain}</b> domínio · <b>${s.sub}</b> sub</span><span><b>${s.memoria}</b> memórias</span><span><b>${(s.bytes/1024).toFixed(1)}</b> KB de memória</span>`;

  const nodes = [], index = {};
  g.agents.forEach((a) => { index['a:' + a.key] = nodes.length; nodes.push({ id: 'a:' + a.key, kind: 'agent', data: a, x: 500, y: 350 }); });
  g.memory.forEach((m) => { index['m:' + m.file] = nodes.length; nodes.push({ id: 'm:' + m.file, kind: 'mem', data: m, x: 500, y: 350 }); });
  const edges = [];
  g.agents.forEach((a) => { if (a.parent && index['a:' + a.parent] != null) edges.push({ s: index['a:' + a.key], t: index['a:' + a.parent], mem: false }); (a.memory || []).forEach((m) => { if (index['m:' + m] != null) edges.push({ s: index['a:' + a.key], t: index['m:' + m], mem: true }); }); });

  // layout radial determinístico: meta no centro, domínio em anel, sub perto do pai, memória no anel externo
  const cx = 500, cy = 350, TAU = Math.PI * 2, at = (id) => nodes[index[id]];
  const metas = g.agents.filter((a) => a.type === 'meta'), domains = g.agents.filter((a) => a.type === 'domain'), subs = g.agents.filter((a) => a.type === 'sub');
  const ang = {};
  metas.forEach((a, i) => { const t = metas.length > 1 ? (i / metas.length) * TAU : 0, r = metas.length > 1 ? 75 : 0; const p = at('a:' + a.key); p.x = cx + Math.cos(t) * r; p.y = cy + Math.sin(t) * r; });
  domains.forEach((a, i) => { const t = (i / Math.max(1, domains.length)) * TAU - Math.PI / 2; ang[a.key] = t; const p = at('a:' + a.key); p.x = cx + Math.cos(t) * 210; p.y = cy + Math.sin(t) * 210; });
  const byParent = {}; subs.forEach((s) => (byParent[s.parent] ||= []).push(s));
  Object.entries(byParent).forEach(([par, arr]) => arr.forEach((s, i) => { const t = (ang[par] ?? 0) + (i - (arr.length - 1) / 2) * 0.34; const p = at('a:' + s.key); p.x = cx + Math.cos(t) * 300; p.y = cy + Math.sin(t) * 300; }));
  const memSorted = g.memory.map((m, i) => ({ m, a: (m.owners && ang[m.owners[0]] != null) ? ang[m.owners[0]] : 90 + i })).sort((x, y) => x.a - y.a).map((o) => o.m);
  memSorted.forEach((m, i) => { const t = (i / Math.max(1, memSorted.length)) * TAU - Math.PI / 2; const p = at('m:' + m.file); p.x = cx + Math.cos(t) * 350; p.y = cy + Math.sin(t) * 350; });

  scene.innerHTML = '';
  edges.forEach((e) => scene.appendChild(el('line', { class: 'edge' + (e.mem ? ' mem' : ''), x1: nodes[e.s].x, y1: nodes[e.s].y, x2: nodes[e.t].x, y2: nodes[e.t].y })));
  nodes.forEach((n) => {
    const gEl = el('g', { class: 'node' + (sel === n.id ? ' sel' : ''), transform: `translate(${n.x},${n.y})` });
    if (n.kind === 'agent') {
      const r = n.data.type === 'meta' ? 16 : n.data.type === 'sub' ? 8 : 12;
      gEl.appendChild(el('circle', { r, fill: n.data.color, 'fill-opacity': .9, stroke: '#000', 'stroke-opacity': .3 }));
      gEl.appendChild(el('text', { y: r + 14, 'text-anchor': 'middle', fill: '#e7e7ea' }, [document.createTextNode(n.data.name)]));
    } else {
      gEl.appendChild(el('rect', { x: -6, y: -6, width: 12, height: 12, rx: 3, fill: '#6a6a72' }));
      gEl.appendChild(el('text', { y: 18, 'text-anchor': 'middle' }, [document.createTextNode(n.data.name)]));
    }
    gEl.addEventListener('click', (ev) => { ev.stopPropagation(); sel = n.id; detail(n, g); render2sel(); });
    scene.appendChild(gEl);
  });
  window._nodes = nodes; window._g = g;
  activity(g.activity);
  fitView(nodes); requestAnimationFrame(() => fitView(nodes));
}
function render2sel() { document.querySelectorAll('.node').forEach((e) => e.classList.remove('sel')); }

function detail(n, g) {
  const d = document.getElementById('detail');
  if (n.kind === 'agent') {
    const a = n.data, colors = { meta: '#C9A96A', domain: '#6AA9C9', sub: '#C96A8A' };
    const mem = (a.memory || []).map((m) => `<span class="chip">${m}</span>`).join('') || '<span class="empty">—</span>';
    d.innerHTML = `<h2>Agente</h2><div class="card"><span class="t">${a.name}</span><span class="tag" style="background:${a.color}22;color:${a.color}">${a.type}</span><p>${a.description}</p><div style="margin-top:8px"><span class="empty" style="font-size:10px;text-transform:uppercase">memória</span><br>${mem}</div></div>`;
  } else {
    const m = n.data, owners = (m.owners || []).map((o) => `<span class="chip">${o}</span>`).join('') || '<span class="empty">sem dono</span>';
    d.innerHTML = `<h2>Memória</h2><div class="card"><span class="t">${m.name}</span><p>${m.description}</p><div style="margin-top:8px"><span class="empty" style="font-size:10px;text-transform:uppercase">lida por</span><br>${owners}</div></div>`;
  }
}
function activity(list) {
  const a = document.getElementById('activity');
  if (!list || !list.length) return;
  a.innerHTML = list.map((x) => `<div class="act"><span class="who">${x.agent}</span> · ${x.type} — ${x.summary}<div class="when">${new Date(x.at).toLocaleString()}</div></div>`).join('');
}

function applyView() { scene.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`); }
function fitView(nodes) {
  if (!nodes || !nodes.length) return;
  const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const w = (maxX - minX) || 1, h = (maxY - minY) || 1, pad = 70;
  const sw = svg.clientWidth || (window.innerWidth - 300), sh = svg.clientHeight || (window.innerHeight - 90);
  view.k = Math.max(0.2, Math.min((sw - pad * 2) / w, (sh - pad * 2) / h, 1.6));
  view.x = (sw - w * view.k) / 2 - minX * view.k;
  view.y = (sh - h * view.k) / 2 - minY * view.k;
  applyView();
}
window.addEventListener('resize', () => window._nodes && fitView(window._nodes));
let drag = null;
svg.addEventListener('mousedown', (e) => { if (e.target.closest('.node')) return; drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; });
window.addEventListener('mousemove', (e) => { if (!drag) return; view.x = drag.vx + (e.clientX - drag.x); view.y = drag.vy + (e.clientY - drag.y); applyView(); });
window.addEventListener('mouseup', () => drag = null);
svg.addEventListener('wheel', (e) => { e.preventDefault(); const f = e.deltaY < 0 ? 1.1 : 0.9; view.k = Math.max(0.3, Math.min(3, view.k * f)); applyView(); }, { passive: false });
svg.addEventListener('click', () => { sel = null; document.getElementById('detail').innerHTML = '<h2>Detalhe</h2><p class="empty">Clique num nó pra ver os detalhes.</p>'; render2sel(); });

render();
const es = new EventSource('/api/stream');
es.addEventListener('reload', () => render());
</script>
</body>
</html>
